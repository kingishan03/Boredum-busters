<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111327" />
    <title>Weather App</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 16px;
        background: #7b76b0;
        color: #24233a;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(100%, 760px);
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      .topbar a {
        color: #24233a;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
      }

      .search-panel,
      .current-weather,
      .forecast-card {
        border: 1px solid rgb(255 255 255 / 45%);
        border-radius: 16px;
        background: #6f9895;
        box-shadow: 0 12px 30px rgb(39 35 74 / 15%);
      }

      .search-panel {
        margin-bottom: 18px;
        padding: 18px;
      }

      .search-panel p {
        margin: 0 0 14px;
        color: #214a47;
      }

      form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
      }

      input,
      button {
        min-height: 46px;
        padding: 10px 14px;
        border: 1px solid #527674;
        border-radius: 8px;
        font: inherit;
      }

      input {
        min-width: 0;
        background: white;
      }

      button {
        background: #145c58;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #104a47;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .location-button {
        margin-top: 10px;
        background: #f4f7f4;
        color: #173b39;
      }

      .location-button:hover:not(:disabled) {
        background: #e0efeb;
      }

      #status {
        min-height: 1.3em;
        margin: 14px 0 0;
        color: #173b39;
      }

      .current-weather {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 16px;
        padding: clamp(18px, 5vw, 30px);
      }

      .current-weather h2 {
        margin: 0 0 6px;
        font-size: 1.5rem;
      }

      #local-time {
        margin: 0;
        color: #214a47;
      }

      .temperature-block {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      #weather-icon {
        font-size: clamp(2.5rem, 10vw, 4rem);
      }

      #temperature {
        font-size: clamp(2.5rem, 10vw, 4rem);
        font-weight: 700;
        line-height: 1;
      }

      #condition {
        grid-column: 1 / -1;
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .weather-details {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 0;
      }

      .weather-details div {
        padding: 12px;
        border-radius: 10px;
        background: rgb(255 255 255 / 40%);
      }

      .weather-details dt {
        color: #214a47;
        font-size: 0.9rem;
      }

      .weather-details dd {
        margin: 5px 0 0;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .forecast-heading {
        margin: 26px 0 12px;
      }

      #forecast {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      .forecast-card {
        padding: 14px 10px;
        text-align: center;
      }

      .forecast-card h3 {
        margin: 0 0 10px;
        font-size: 0.95rem;
      }

      .forecast-icon {
        display: block;
        margin-bottom: 8px;
        font-size: 1.8rem;
      }

      .forecast-condition {
        min-height: 2.4em;
        margin: 0 0 8px;
        color: #214a47;
        font-size: 0.85rem;
      }

      .forecast-temperatures {
        margin: 0;
        font-weight: 700;
      }

      .forecast-rain {
        margin: 7px 0 0;
        color: #214a47;
        font-size: 0.85rem;
      }

      .attribution {
        margin: 18px 0 0;
        color: #24233a;
        font-size: 0.85rem;
        text-align: center;
      }

      .attribution a {
        color: inherit;
      }

      body {
        background:
          radial-gradient(ellipse at 12% 0%, rgb(167 139 250 / 18%), transparent 34rem),
          #111327;
        color: #f7f6ff;
      }
      .topbar a, .attribution a { color: #cbbaff; }
      .search-panel, .current-weather, .forecast-card {
        border-color: rgb(255 255 255 / 12%);
        background: #1b1d35;
        box-shadow: 0 16px 38px rgb(0 0 0 / 18%);
      }
      .search-panel p, #local-time, .weather-details dt,
      .forecast-condition, .forecast-rain, .attribution { color: #c2bfd5; }
      input {
        border-color: #494660;
        background: #111327;
        color: #f7f6ff;
      }
      button {
        border: 0;
        background: linear-gradient(110deg, #bba8ff, #ff9acb);
        color: #18152a;
      }
      button:hover:not(:disabled) { background: #e0d4ff; }
      .location-button {
        border: 1px solid rgb(255 255 255 / 14%);
        background: #282641;
        color: #e8e4f5;
      }
      .location-button:hover:not(:disabled) { background: #373052; }
      .weather-details div { background: #282641; }
      .weather-details dd { color: #f7f6ff; }
      button:focus-visible, input:focus-visible, a:focus-visible {
        outline: 3px solid white;
        outline-offset: 3px;
      }

      [hidden] {
        display: none !important;
      }

      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 3px solid #f4ce67;
        outline-offset: 2px;
      }

      @media (max-width: 560px) {
        #forecast {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .forecast-card:last-child {
          grid-column: 1 / -1;
        }

        .weather-details {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 360px) {
        form {
          grid-template-columns: 1fr;
        }

        .current-weather {
          grid-template-columns: 1fr;
        }

        .temperature-block {
          justify-content: flex-start;
        }
      }
      .site-logo { position: fixed; top: 12px; left: 12px; z-index: 1000; display: block; width: 52px; height: 52px; }
      .site-logo img { display: block; width: 100%; height: 100%; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 16px rgb(0 0 0 / 28%); }
      .topbar { padding-left: 60px; }
    </style>
  </head>
  <body>
    <a class="site-logo" href="../home.html" aria-label="Boredom-Busters home"><img src="../Website logo.png" alt="" /></a>
    <main>
      <header class="topbar">
        <h1>Weather</h1>
        <a href="../home.html">Back to home</a>
      </header>

      <section class="search-panel" aria-label="Find weather">
        <p>Look up current conditions and a five-day forecast for a city.</p>
        <form id="city-form">
          <label for="city" hidden>City name</label>
          <input id="city" name="city" type="search" placeholder="Enter a city, e.g. Tokyo" required />
          <button id="search-button" type="submit">Search</button>
        </form>
        <button id="location-button" class="location-button" type="button">Use my location</button>
        <p id="status" role="status" aria-live="polite">Search for a city to see its weather.</p>
      </section>

      <section id="weather" aria-label="Current weather and forecast" hidden>
        <article class="current-weather">
          <div>
            <h2 id="place-name"></h2>
            <p id="local-time"></p>
          </div>
          <div class="temperature-block">
            <span id="weather-icon" aria-hidden="true"></span>
            <span id="temperature"></span>
          </div>
          <p id="condition"></p>
          <dl class="weather-details">
            <div>
              <dt>Feels like</dt>
              <dd id="feels-like"></dd>
            </div>
            <div>
              <dt>Humidity</dt>
              <dd id="humidity"></dd>
            </div>
            <div>
              <dt>Wind</dt>
              <dd id="wind"></dd>
            </div>
          </dl>
        </article>

        <h2 class="forecast-heading">5-day forecast</h2>
        <div id="forecast" aria-label="Five-day forecast"></div>
      </section>

      <p class="attribution">
        Weather data provided by
        <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>.
      </p>
    </main>
    <script>
      const cityForm = document.querySelector("#city-form");
      const cityInput = document.querySelector("#city");
      const searchButton = document.querySelector("#search-button");
      const locationButton = document.querySelector("#location-button");
      const status = document.querySelector("#status");
      const weatherSection = document.querySelector("#weather");

      const weatherDescriptions = {
        0: ["Clear sky", "☀️", "🌙"],
        1: ["Mainly clear", "🌤️", "🌙"],
        2: ["Partly cloudy", "⛅", "☁️"],
        3: ["Overcast", "☁️", "☁️"],
        45: ["Fog", "🌫️", "🌫️"],
        48: ["Depositing rime fog", "🌫️", "🌫️"],
        51: ["Light drizzle", "🌦️", "🌧️"],
        53: ["Moderate drizzle", "🌦️", "🌧️"],
        55: ["Dense drizzle", "🌧️", "🌧️"],
        56: ["Light freezing drizzle", "🌧️", "🌧️"],
        57: ["Dense freezing drizzle", "🌧️", "🌧️"],
        61: ["Slight rain", "🌦️", "🌧️"],
        63: ["Moderate rain", "🌧️", "🌧️"],
        65: ["Heavy rain", "🌧️", "🌧️"],
        66: ["Light freezing rain", "🌧️", "🌧️"],
        67: ["Heavy freezing rain", "🌧️", "🌧️"],
        71: ["Slight snow", "🌨️", "🌨️"],
        73: ["Moderate snow", "🌨️", "🌨️"],
        75: ["Heavy snow", "❄️", "❄️"],
        77: ["Snow grains", "🌨️", "🌨️"],
        80: ["Slight rain showers", "🌦️", "🌧️"],
        81: ["Moderate rain showers", "🌧️", "🌧️"],
        82: ["Violent rain showers", "⛈️", "⛈️"],
        85: ["Slight snow showers", "🌨️", "🌨️"],
        86: ["Heavy snow showers", "❄️", "❄️"],
        95: ["Thunderstorm", "⛈️", "⛈️"],
        96: ["Thunderstorm with light hail", "⛈️", "⛈️"],
        99: ["Thunderstorm with heavy hail", "⛈️", "⛈️"],
      };

      function weatherInfo(code, isDay = true) {
        return weatherDescriptions[code] || ["Unknown conditions", "🌡️", "🌡️"];
      }

      function formatDate(dateString, options) {
        return new Intl.DateTimeFormat(undefined, options).format(
          new Date(`${dateString}T12:00:00`)
        );
      }

      function displayForecast(daily) {
        const forecast = document.querySelector("#forecast");
        forecast.replaceChildren();

        daily.time.forEach((date, index) => {
          const [description, icon] = weatherInfo(daily.weather_code[index]);
          const card = document.createElement("article");
          card.className = "forecast-card";

          const day = document.createElement("h3");
          day.textContent = formatDate(date, { weekday: "short" });

          const weatherIcon = document.createElement("span");
          weatherIcon.className = "forecast-icon";
          weatherIcon.setAttribute("aria-hidden", "true");
          weatherIcon.textContent = icon;

          const condition = document.createElement("p");
          condition.className = "forecast-condition";
          condition.textContent = description;

          const temperatures = document.createElement("p");
          temperatures.className = "forecast-temperatures";
          temperatures.textContent =
            `${Math.round(daily.temperature_2m_max[index])}° / ` +
            `${Math.round(daily.temperature_2m_min[index])}°C`;

          const rain = document.createElement("p");
          rain.className = "forecast-rain";
          rain.textContent = `Rain ${daily.precipitation_probability_max[index] ?? 0}%`;

          card.append(day, weatherIcon, condition, temperatures, rain);
          forecast.append(card);
        });
      }

      async function loadWeather(latitude, longitude, placeName) {
        status.textContent = "Loading weather...";
        weatherSection.hidden = true;

        const params = new URLSearchParams({
          latitude: String(latitude),
          longitude: String(longitude),
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m",
          daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
          timezone: "auto",
          forecast_days: "5",
        });
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) {
          throw new Error("Weather data could not be loaded. Please try again.");
        }

        const data = await response.json();
        if (!data.current || !data.daily) {
          throw new Error("The weather service returned incomplete data.");
        }

        const current = data.current;
        const [description, dayIcon, nightIcon] = weatherInfo(
          current.weather_code,
          current.is_day === 1
        );

        document.querySelector("#place-name").textContent = placeName;
        document.querySelector("#local-time").textContent =
          `Local time: ${new Intl.DateTimeFormat(undefined, {
            weekday: "long",
            hour: "numeric",
            minute: "2-digit",
            timeZone: data.timezone,
          }).format(new Date())}`;
        document.querySelector("#weather-icon").textContent =
          current.is_day === 1 ? dayIcon : nightIcon;
        document.querySelector("#temperature").textContent =
          `${Math.round(current.temperature_2m)}°C`;
        document.querySelector("#condition").textContent = description;
        document.querySelector("#feels-like").textContent =
          `${Math.round(current.apparent_temperature)}°C`;
        document.querySelector("#humidity").textContent =
          `${current.relative_humidity_2m}%`;
        document.querySelector("#wind").textContent =
          `${Math.round(current.wind_speed_10m)} km/h`;

        displayForecast(data.daily);
        weatherSection.hidden = false;
        status.textContent = `Weather loaded for ${placeName}.`;
      }

      async function searchCity(city) {
        status.textContent = "Finding city...";
        weatherSection.hidden = true;
        const params = new URLSearchParams({
          name: city,
          count: "1",
          language: "en",
          format: "json",
        });
        const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?${params}`);
        if (!response.ok) {
          throw new Error("City search is unavailable. Check your connection and try again.");
        }
        const data = await response.json();
        const place = data.results?.[0];
        if (!place) {
          throw new Error(`No city found for "${city}". Check the spelling and try again.`);
        }

        const location = [place.name, place.admin1, place.country]
          .filter((part, index, parts) => part && parts.indexOf(part) === index)
          .join(", ");
        await loadWeather(place.latitude, place.longitude, location);
      }

      cityForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const city = cityInput.value.trim();
        if (!city) {
          status.textContent = "Enter a city name to search.";
          return;
        }

        searchButton.disabled = true;
        locationButton.disabled = true;
        try {
          await searchCity(city);
        } catch (error) {
          status.textContent = error instanceof Error
            ? error.message
            : "Weather search failed. Please try again.";
        } finally {
          searchButton.disabled = false;
          locationButton.disabled = false;
        }
      });

      locationButton.addEventListener("click", () => {
        if (!navigator.geolocation) {
          status.textContent = "Location lookup is not supported by this browser.";
          return;
        }

        searchButton.disabled = true;
        locationButton.disabled = true;
        status.textContent = "Getting your location...";
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            try {
              const { latitude, longitude } = position.coords;
              await loadWeather(latitude, longitude, "Your location");
            } catch (error) {
              status.textContent = error instanceof Error
                ? error.message
                : "Weather search failed. Please try again.";
            } finally {
              searchButton.disabled = false;
              locationButton.disabled = false;
            }
          },
          (error) => {
            const message = error.code === error.PERMISSION_DENIED
              ? "Location access was denied. You can search for a city instead."
              : "Could not get your location. You can search for a city instead.";
            status.textContent = message;
            searchButton.disabled = false;
            locationButton.disabled = false;
          },
          { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
        );
      });
    </script>
  </body>
</html>
