<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111327" />
    <title>Quick Quiz</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 28px 16px; background: #7b76b0; color: #24233a; font-family: Arial, sans-serif; }
      main { width: min(100%, 680px); margin: 0 auto; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
      .topbar a { color: #24233a; font-weight: 700; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); }
      .quiz { padding: clamp(20px, 5vw, 32px); border: 1px solid rgb(255 255 255 / 45%); border-radius: 16px; background: #6f9895; box-shadow: 0 12px 30px rgb(39 35 74 / 15%); }
      #progress { color: #214a47; font-weight: 700; }
      #question { margin: 22px 0; font-size: 1.4rem; }
      #answers { display: grid; gap: 10px; }
      button { min-height: 48px; padding: 11px 14px; border: 1px solid #527674; border-radius: 8px; background: #f4f7f4; color: #173b39; font: inherit; font-weight: 700; text-align: left; cursor: pointer; }
      button:hover:not(:disabled) { background: white; }
      button:disabled { cursor: default; }
      #next, #restart { margin-top: 18px; background: #145c58; color: white; text-align: center; }
      #feedback { min-height: 1.5em; font-weight: 700; }
      [hidden] { display: none !important; }
      body {
        background:
          radial-gradient(ellipse at 12% 0%, rgb(167 139 250 / 18%), transparent 34rem),
          #111327;
        color: #f7f6ff;
      }
      .topbar a { color: #cbbaff; }
      .quiz {
        border-color: rgb(255 255 255 / 12%);
        background: #1b1d35;
        box-shadow: 0 20px 55px rgb(0 0 0 / 24%);
      }
      #progress { color: #a9efd8; }
      button {
        border-color: rgb(255 255 255 / 12%);
        background: #282641;
        color: #f7f6ff;
      }
      button:hover:not(:disabled) { background: #373052; }
      #next, #restart {
        border: 0;
        background: linear-gradient(110deg, #bba8ff, #ff9acb);
        color: #18152a;
      }
      #feedback { color: #a9efd8; }
      button:focus-visible, a:focus-visible { outline: 3px solid white; outline-offset: 3px; }
      .site-logo { position: fixed; top: 12px; left: 12px; z-index: 1000; display: block; width: 52px; height: 52px; }
      .site-logo img { display: block; width: 100%; height: 100%; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 16px rgb(0 0 0 / 28%); }
      .topbar { padding-left: 60px; }
    </style>
  </head>
  <body>
    <a class="site-logo" href="../home.html" aria-label="Boredom-Busters home"><img src="../Website logo.png" alt="" /></a>
    <main>
      <header class="topbar"><h1>Quick quiz</h1><a href="../home.html">Home</a></header>
      <section class="quiz" aria-labelledby="question">
        <p id="progress"></p>
        <h2 id="question"></h2>
        <div id="answers"></div>
        <p id="feedback" role="status" aria-live="polite"></p>
        <button id="next" type="button" hidden>Next question</button>
        <div id="result" hidden><h2 id="score"></h2><button id="restart" type="button">Play again</button></div>
      </section>
    </main>
    <script>
      const questions = [
        { question: "Which planet is known as the Red Planet?", answers: ["Venus", "Mars", "Jupiter", "Mercury"], correct: 1 },
        { question: "What is the largest ocean on Earth?", answers: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: 3 },
        { question: "How many sides does a hexagon have?", answers: ["Five", "Six", "Seven", "Eight"], correct: 1 },
        { question: "What is the capital city of Japan?", answers: ["Seoul", "Beijing", "Tokyo", "Bangkok"], correct: 2 },
        { question: "Which gas do plants absorb from the atmosphere?", answers: ["Oxygen", "Nitrogen", "Carbon dioxide", "Helium"], correct: 2 }
      ];
      const progress = document.querySelector("#progress");
      const questionText = document.querySelector("#question");
      const answers = document.querySelector("#answers");
      const feedback = document.querySelector("#feedback");
      const next = document.querySelector("#next");
      const result = document.querySelector("#result");
      let index = 0;
      let score = 0;
      function showQuestion() {
        result.hidden = true;
        next.hidden = true;
        feedback.textContent = "";
        answers.replaceChildren();
        const current = questions[index];
        progress.textContent = `Question ${index + 1} of ${questions.length}`;
        questionText.textContent = current.question;
        current.answers.forEach((answer, answerIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = answer;
          button.addEventListener("click", () => {
            answers.querySelectorAll("button").forEach((choice) => { choice.disabled = true; });
            if (answerIndex === current.correct) {
              score += 1;
              feedback.textContent = "Correct! Nice work.";
            } else {
              feedback.textContent = `Not quite. The answer is ${current.answers[current.correct]}.`;
            }
            next.hidden = false;
            next.textContent = index === questions.length - 1 ? "See your score" : "Next question";
            next.focus();
          });
          answers.append(button);
        });
      }
      next.addEventListener("click", () => {
        index += 1;
        if (index < questions.length) {
          showQuestion();
        } else {
          questionText.textContent = "Quiz complete!";
          progress.textContent = "Thanks for playing.";
          answers.replaceChildren();
          feedback.textContent = "";
          next.hidden = true;
          result.hidden = false;
          document.querySelector("#score").textContent = `You scored ${score} out of ${questions.length}`;
        }
      });
      document.querySelector("#restart").addEventListener("click", () => { index = 0; score = 0; showQuestion(); });
      showQuestion();
    </script>
  </body>
</html>
