<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#22202a" />
    <title>Quick Draw Challenge — Boredom-Busters</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 24px 16px; background: radial-gradient(ellipse at 92% 0%, #54424a, transparent 42%), #22202a; color: #fffaf7; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      main { width: min(100%, 860px); margin: 0 auto; }
      nav { margin-bottom: 22px; } a { color: #ffc99f; font-weight: 750; }
      .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
      .eyebrow { margin: 0; color: #ffc99f; font-size: .78rem; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; }
      h1 { margin: 6px 0; font-size: clamp(2.2rem, 8vw, 3.8rem); letter-spacing: -.06em; }
      #timer { padding-bottom: 9px; color: #ffc99f; font-size: 1.25rem; font-weight: 850; font-variant-numeric: tabular-nums; }
      .prompt { margin: 14px 0 18px; color: #ddd4d0; line-height: 1.55; }
      .prompt strong { color: #fff0df; }
      .canvas-wrap { overflow: hidden; border: 1px solid #ffffff2b; border-radius: 20px; background: #fffdf9; box-shadow: 0 20px 55px #0004; }
      canvas { display: block; width: 100%; height: clamp(260px, 48vh, 440px); touch-action: none; cursor: crosshair; }
      .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      button { min-height: 44px; padding: 10px 15px; border: 1px solid #ffffff2c; border-radius: 11px; background: #39343a; color: #fffaf7; font: inherit; font-weight: 800; cursor: pointer; }
      button.primary { border-color: transparent; background: #ffc99f; color: #31231e; }
      button:hover { filter: brightness(1.1); }
      button:focus-visible, a:focus-visible { outline: 3px solid white; outline-offset: 3px; }
      #status { min-height: 1.5em; margin: 14px 2px; color: #e1cfc4; }
      @media (max-width: 540px) { body { padding: 18px 12px; } .head { align-items: flex-start; } canvas { height: 300px; } }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="../home.html">← All mini apps</a></nav>
      <header class="head"><div><p class="eyebrow">Ready, set, doodle!</p><h1>Quick Draw <span aria-hidden="true">🖍️</span></h1></div><p id="timer" role="timer" aria-live="off">45s</p></header>
      <p class="prompt">Your challenge: <strong id="challenge" aria-live="polite"></strong> Draw it before the timer runs out—or just doodle for fun.</p>
      <div class="canvas-wrap"><canvas id="canvas" role="img" aria-label="Drawing area. Use a mouse, touch, or stylus to draw."></canvas></div>
      <div class="actions">
        <button id="start" class="primary" type="button">Start 45-second round</button>
        <button id="new" type="button">New prompt</button>
        <button id="clear" type="button">Clear canvas</button>
      </div>
      <p id="status" role="status" aria-live="polite">Use your mouse, finger, or stylus to draw on the canvas.</p>
    </main>
    <script>
      const prompts = ["a friendly little monster", "your dream treehouse", "a rocket with a silly hat", "a tiny island getaway", "the world's happiest cloud", "a robot's pet", "a very fancy sandwich", "a dragon learning to dance"];
      const canvas = document.querySelector("#canvas");
      const context = canvas.getContext("2d");
      const timer = document.querySelector("#timer");
      const status = document.querySelector("#status");
      const startButton = document.querySelector("#start");
      let drawing = false;
      let seconds = 45;
      let interval;
      function fitCanvas() {
        const rect = canvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.round(rect.width * ratio);
        canvas.height = Math.round(rect.height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.lineWidth = 4;
        context.lineCap = "round";
        context.lineJoin = "round";
        context.strokeStyle = "#342c31";
      }
      function setPrompt() {
        document.querySelector("#challenge").textContent = prompts[Math.floor(Math.random() * prompts.length)];
        status.textContent = "New prompt ready. Let your imagination loose!";
      }
      function stopRound(message) {
        window.clearInterval(interval);
        interval = undefined;
        startButton.disabled = false;
        startButton.textContent = "Start another round";
        status.textContent = message;
      }
      function position(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }
      canvas.addEventListener("pointerdown", (event) => {
        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        const point = position(event);
        context.beginPath();
        context.moveTo(point.x, point.y);
      });
      canvas.addEventListener("pointermove", (event) => {
        if (!drawing) return;
        const point = position(event);
        context.lineTo(point.x, point.y);
        context.stroke();
      });
      function finishStroke() { drawing = false; context.closePath(); }
      canvas.addEventListener("pointerup", finishStroke);
      canvas.addEventListener("pointercancel", finishStroke);
      document.querySelector("#start").addEventListener("click", () => {
        if (interval) return;
        seconds = 45;
        timer.textContent = "45s";
        startButton.disabled = true;
        startButton.textContent = "Drawing time!";
        status.textContent = "Go! Your 45-second drawing round has started.";
        interval = window.setInterval(() => {
          seconds -= 1;
          timer.textContent = `${seconds}s`;
          if (seconds <= 0) stopRound("Time! Your masterpiece is ready for admiration. 🎉");
        }, 1000);
      });
      document.querySelector("#new").addEventListener("click", setPrompt);
      document.querySelector("#clear").addEventListener("click", () => {
        context.clearRect(0, 0, canvas.width, canvas.height);
        status.textContent = "Canvas cleared. Ready for a fresh doodle!";
      });
      window.addEventListener("resize", fitCanvas);
      fitCanvas();
      setPrompt();
    </script>
  </body>
</html>
