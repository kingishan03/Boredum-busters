<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172324" />
    <title>Color Quest — Boredom-Busters</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px 14px; background: radial-gradient(ellipse at 50% 0%, #284348, transparent 50%), #172324; color: #f1fffa; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      main { width: min(100%, 620px); text-align: center; }
      nav { margin-bottom: 22px; text-align: left; }
      a { color: #a8e8d1; font-weight: 750; }
      .label { color: #a8e8d1; font-size: .78rem; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; }
      h1 { margin: 8px 0; font-size: clamp(2.4rem, 9vw, 4rem); letter-spacing: -.06em; }
      .lead { color: #b8cdca; line-height: 1.6; }
      .quest { margin-top: 24px; padding: clamp(22px, 6vw, 40px); border: 1px solid #ffffff20; border-radius: 28px; background: #203334; box-shadow: 0 25px 65px #0005; }
      .swatch { display: grid; width: 128px; height: 128px; place-items: center; margin: 0 auto 20px; border: 6px solid #ffffff22; border-radius: 38px; box-shadow: 0 14px 35px #0004; color: #162222; font-size: 2rem; }
      #prompt { margin: 0; font-size: clamp(1.3rem, 5vw, 1.8rem); font-weight: 850; line-height: 1.35; }
      #timer { margin: 10px 0 24px; color: #a8e8d1; font-size: 1.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
      .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
      button { min-height: 46px; padding: 11px 16px; border: 1px solid #ffffff2a; border-radius: 12px; background: #2d4948; color: #effff9; font: inherit; font-weight: 800; cursor: pointer; }
      button.primary { border-color: transparent; background: #a8e8d1; color: #152b29; }
      button:hover { filter: brightness(1.12); transform: translateY(-1px); }
      button:focus-visible, a:focus-visible { outline: 3px solid white; outline-offset: 3px; }
      #result { min-height: 1.5em; margin: 20px 0 0; color: #c2f5df; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="../home.html">← All mini apps</a></nav>
      <p class="label">Look up from your screen</p>
      <h1>Color Quest <span aria-hidden="true">🎨</span></h1>
      <p class="lead">You have 30 seconds to spot something nearby that matches the color. Ready, explorer?</p>
      <section class="quest" aria-label="Color scavenger challenge">
        <div id="swatch" class="swatch" aria-hidden="true"></div>
        <p id="prompt" aria-live="polite"></p>
        <p id="timer" role="timer" aria-live="off">30 seconds</p>
        <div class="actions">
          <button id="start" class="primary" type="button">Start quest</button>
          <button id="found" type="button" disabled>I found one!</button>
          <button id="skip" type="button">New color</button>
        </div>
        <p id="result" role="status" aria-live="polite">Pick a color and get ready to explore.</p>
      </section>
    </main>
    <script>
      const colors = [
        { name: "ocean blue", value: "#53b7dd" }, { name: "sunshine yellow", value: "#ffd15c" },
        { name: "leaf green", value: "#82d6a5" }, { name: "berry pink", value: "#f28ab5" },
        { name: "tangerine orange", value: "#ff9c64" }, { name: "lavender", value: "#bca4f5" },
        { name: "bright red", value: "#ef7676" }, { name: "cloud white", value: "#f1f3ed" }
      ];
      const swatch = document.querySelector("#swatch");
      const prompt = document.querySelector("#prompt");
      const timerDisplay = document.querySelector("#timer");
      const result = document.querySelector("#result");
      const foundButton = document.querySelector("#found");
      let colorIndex = -1;
      let seconds = 30;
      let interval;
      function stopTimer() {
        window.clearInterval(interval);
        interval = undefined;
        foundButton.disabled = true;
      }
      function nextColor() {
        stopTimer();
        let next = Math.floor(Math.random() * colors.length);
        if (colors.length > 1 && next === colorIndex) next = (next + 1) % colors.length;
        colorIndex = next;
        const color = colors[colorIndex];
        swatch.style.backgroundColor = color.value;
        swatch.setAttribute("aria-label", color.name);
        swatch.textContent = "";
        prompt.textContent = `Find something ${color.name}!`;
        seconds = 30;
        timerDisplay.textContent = `${seconds} seconds`;
        result.textContent = "Pick a color and get ready to explore.";
        document.querySelector("#start").disabled = false;
        document.querySelector("#start").textContent = "Start quest";
      }
      document.querySelector("#start").addEventListener("click", () => {
        if (interval) return;
        seconds = 30;
        timerDisplay.textContent = `${seconds} seconds`;
        result.textContent = "Go find your color!";
        foundButton.disabled = false;
        document.querySelector("#start").disabled = true;
        document.querySelector("#start").textContent = "Quest in progress";
        interval = window.setInterval(() => {
          seconds -= 1;
          timerDisplay.textContent = `${seconds} ${seconds === 1 ? "second" : "seconds"}`;
          if (seconds <= 0) {
            stopTimer();
            result.textContent = "Time's up! Want to try another color?";
            document.querySelector("#start").disabled = false;
            document.querySelector("#start").textContent = "Try again";
          }
        }, 1000);
      });
      foundButton.addEventListener("click", () => {
        stopTimer();
        result.textContent = "Quest complete! Great color spotting. ✨";
        document.querySelector("#start").disabled = false;
        document.querySelector("#start").textContent = "Play again";
      });
      document.querySelector("#skip").addEventListener("click", nextColor);
      nextColor();
    </script>
  </body>
</html>
