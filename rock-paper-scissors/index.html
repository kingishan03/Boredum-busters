<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18354b" />
    <title>Rock Paper Scissors</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 24px 16px; background: #18354b; color: #fff; font-family: Arial, sans-serif; }
      main { width: min(100%, 700px); margin: 0 auto; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
      .topbar a { color: #b7ecf2; font-weight: 700; }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 3rem); }
      .game { padding: clamp(20px, 5vw, 32px); border: 1px solid rgb(255 255 255 / 15%); border-radius: 20px; background: #244b60; box-shadow: 0 18px 45px rgb(0 0 0 / 22%); text-align: center; }
      .intro { margin: 0 0 22px; color: #d3edf0; line-height: 1.5; }
      .scoreboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
      .stat { padding: 12px 8px; border-radius: 12px; background: rgb(255 255 255 / 8%); }
      .stat span { display: block; color: #c4e3e7; font-size: 0.9rem; }
      .stat strong { display: block; margin-top: 5px; font-size: 1.8rem; }
      .choices { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
      button { min-height: 56px; padding: 10px 18px; border: 0; border-radius: 12px; background: #d6f7f1; color: #18354b; font: inherit; font-weight: 800; cursor: pointer; }
      .choice { min-width: 130px; font-size: 1.1rem; }
      button:hover:not(:disabled) { background: white; transform: translateY(-2px); }
      button:disabled { cursor: default; opacity: 0.6; }
      #result { min-height: 2rem; margin: 24px 0 8px; font-size: 1.25rem; font-weight: 800; }
      #matchup { min-height: 1.5em; margin: 0; color: #d3edf0; }
      #reset { min-height: 42px; margin-top: 18px; padding: 8px 16px; background: transparent; color: white; border: 1px solid rgb(255 255 255 / 45%); }
      button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
      @media (max-width: 480px) { body { padding: 16px 10px; } .choice { min-width: 100px; padding: 10px; } }
      .site-logo { position: fixed; top: 12px; left: 12px; z-index: 1000; display: block; width: 52px; height: 52px; }
      .site-logo img { display: block; width: 100%; height: 100%; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 16px rgb(0 0 0 / 28%); }
      .topbar { padding-left: 60px; }
    </style>
  </head>
  <body>
    <a class="site-logo" href="../home.html" aria-label="Boredom-Busters home"><img src="../Website logo.png" alt="" /></a>
    <main>
      <header class="topbar"><h1>Rock Paper Scissors</h1><a href="../home.html">Home</a></header>
      <section class="game" aria-label="Rock Paper Scissors game">
        <p class="intro">Pick your move. First to five wins takes the match!</p>
        <div class="scoreboard" aria-label="Match score">
          <div class="stat"><span>You</span><strong id="player-score">0</strong></div>
          <div class="stat"><span>Round</span><strong id="round">0</strong></div>
          <div class="stat"><span>Computer</span><strong id="computer-score">0</strong></div>
        </div>
        <div class="choices" aria-label="Choose your move">
          <button class="choice" type="button" data-choice="rock">✊ Rock</button>
          <button class="choice" type="button" data-choice="paper">✋ Paper</button>
          <button class="choice" type="button" data-choice="scissors">✌️ Scissors</button>
        </div>
        <p id="result" role="status" aria-live="polite">Ready? Make your move!</p>
        <p id="matchup">Rock beats scissors · Paper beats rock · Scissors beats paper</p>
        <button id="reset" type="button">Reset match</button>
      </section>
    </main>
    <script>
      const choices = ["rock", "paper", "scissors"];
      const playerScoreDisplay = document.querySelector("#player-score");
      const computerScoreDisplay = document.querySelector("#computer-score");
      const roundDisplay = document.querySelector("#round");
      const result = document.querySelector("#result");
      const matchup = document.querySelector("#matchup");
      const choiceButtons = [...document.querySelectorAll(".choice")];
      let playerScore = 0;
      let computerScore = 0;
      let round = 0;
      let finished = false;

      function play(player) {
        if (finished) return;
        const computer = choices[Math.floor(Math.random() * choices.length)];
        round += 1;
        roundDisplay.textContent = round;

        if (player === computer) {
          result.textContent = "It's a tie!";
        } else if (
          (player === "rock" && computer === "scissors") ||
          (player === "paper" && computer === "rock") ||
          (player === "scissors" && computer === "paper")
        ) {
          playerScore += 1;
          result.textContent = "You win this round!";
        } else {
          computerScore += 1;
          result.textContent = "The computer wins this round.";
        }

        playerScoreDisplay.textContent = playerScore;
        computerScoreDisplay.textContent = computerScore;
        matchup.textContent = `You chose ${player}; the computer chose ${computer}.`;

        if (playerScore === 5 || computerScore === 5) {
          finished = true;
          result.textContent = playerScore === 5 ? "You won the match! 🎉" : "The computer won the match. Play again!";
          choiceButtons.forEach((button) => { button.disabled = true; });
        }
      }

      choiceButtons.forEach((button) => {
        button.addEventListener("click", () => play(button.dataset.choice));
      });

      document.querySelector("#reset").addEventListener("click", () => {
        playerScore = 0;
        computerScore = 0;
        round = 0;
        finished = false;
        playerScoreDisplay.textContent = "0";
        computerScoreDisplay.textContent = "0";
        roundDisplay.textContent = "0";
        result.textContent = "Ready? Make your move!";
        matchup.textContent = "Rock beats scissors · Paper beats rock · Scissors beats paper";
        choiceButtons.forEach((button) => { button.disabled = false; });
      });
    </script>
  </body>
</html>
