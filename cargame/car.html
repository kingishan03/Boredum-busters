<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111327" />
    <title>Road Rush - Car Game</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 16px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 0%, #44366e 0, transparent 48%),
          #111327;
        color: #f1f7ef;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(100%, 480px);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .subtitle {
        margin: 8px 0 18px;
        color: #b5d2ca;
      }

      .scoreboard {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 0 auto 12px;
        padding: 12px 16px;
        border: 1px solid #477078;
        border-radius: 12px;
        background: #173b42;
        font-weight: 700;
      }

      .scoreboard span {
        color: #f5cc63;
        font-variant-numeric: tabular-nums;
      }

      .game-frame {
        position: relative;
        overflow: hidden;
        width: min(100%, 420px);
        margin: 0 auto;
        border: 4px solid #477078;
        border-radius: 16px;
        background: #29343a;
        box-shadow: 0 18px 42px rgb(0 0 0 / 30%);
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 420 / 640;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgb(8 26 31 / 78%);
      }

      .overlay[hidden] {
        display: none;
      }

      .overlay-card {
        width: min(100%, 300px);
        padding: 24px 20px;
        border: 1px solid #6b9496;
        border-radius: 16px;
        background: #173b42;
      }

      .overlay h2 {
        margin: 0 0 10px;
        font-size: 1.8rem;
      }

      .overlay p {
        margin: 0 0 18px;
        color: #c5d9d2;
        line-height: 1.5;
      }

      button {
        min-height: 46px;
        padding: 10px 20px;
        border: 0;
        border-radius: 9px;
        background: #f5cc63;
        color: #183338;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: #ffdb7c;
      }

      button:focus-visible {
        outline: 3px solid white;
        outline-offset: 3px;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin: 14px auto 10px;
      }

      .controls button {
        width: 84px;
        font-size: 1.35rem;
      }

      .help {
        margin: 0;
        color: #b5d2ca;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .back-link {
        display: inline-block;
        margin-top: 16px;
        padding: 9px 13px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 999px;
        color: #b5d2ca;
        text-decoration: none;
      }
      .back-link:hover { background: rgb(255 255 255 / 7%); color: white; }
      .game-frame { border-color: rgb(255 255 255 / 15%); }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }
      }
      .site-logo { position: fixed; top: 12px; left: 12px; z-index: 1000; display: block; width: 52px; height: 52px; }
      .site-logo img { display: block; width: 100%; height: 100%; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 16px rgb(0 0 0 / 28%); }
      body { padding-top: 82px; }
    </style>
  </head>
  <body>
    <a class="site-logo" href="../home.html" aria-label="Boredom-Busters home"><img src="../Website logo.png" alt="" /></a>
    <main>
      <h1>Road Rush</h1>
      <p class="subtitle">Dodge traffic. See how far you can go!</p>

      <div class="scoreboard" aria-label="Game scores">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="best">0</span></div>
      </div>

      <div class="game-frame">
        <canvas id="game" width="420" height="640" aria-label="Car driving game"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <h2 id="overlay-title">Ready to race?</h2>
            <p id="overlay-message">Use the left and right arrow keys or A and D to dodge the other cars.</p>
            <button id="start-button" type="button">Start driving</button>
          </div>
        </div>
      </div>

      <div class="controls" aria-label="Driving controls">
        <button id="left-button" type="button" aria-label="Move left">←</button>
        <button id="pause-button" type="button" aria-label="Pause game" disabled>Pause</button>
        <button id="right-button" type="button" aria-label="Move right">→</button>
      </div>
      <p class="help">Arrow keys or A / D to steer · Space to start · P or Esc to pause</p>
      <a class="back-link" href="../home.html">Back to the home page</a>
    </main>

    <script>
      const canvas = document.querySelector("#game");
      const context = canvas.getContext("2d");
      const scoreDisplay = document.querySelector("#score");
      const bestDisplay = document.querySelector("#best");
      const overlay = document.querySelector("#overlay");
      const overlayTitle = document.querySelector("#overlay-title");
      const overlayMessage = document.querySelector("#overlay-message");
      const startButton = document.querySelector("#start-button");
      const pauseButton = document.querySelector("#pause-button");

      const width = 420;
      const height = 640;
      const lanes = [115, 210, 305];
      const carColors = ["#ff704f", "#a98bff", "#f4c94f", "#45c4b0"];
      const player = { lane: 1, y: 526, width: 46, height: 78 };
      let obstacles = [];
      let score = 0;
      let best = 0;
      let speed = 250;
      let spawnTimer = 0;
      let roadOffset = 0;
      let lastFrame = 0;
      let state = "ready";

      function roundedRect(x, y, rectWidth, rectHeight, radius) {
        context.beginPath();
        context.roundRect(x, y, rectWidth, rectHeight, radius);
        context.fill();
      }

      function drawCar(centerX, y, color, isPlayer) {
        const carWidth = isPlayer ? player.width : 44;
        const carHeight = isPlayer ? player.height : 74;
        const left = centerX - carWidth / 2;

        context.fillStyle = "#152226";
        roundedRect(left - 4, y + 12, 8, 18, 3);
        roundedRect(left + carWidth - 4, y + 12, 8, 18, 3);
        roundedRect(left - 4, y + carHeight - 30, 8, 18, 3);
        roundedRect(left + carWidth - 4, y + carHeight - 30, 8, 18, 3);

        context.fillStyle = color;
        roundedRect(left, y, carWidth, carHeight, 11);
        context.fillStyle = isPlayer ? "#bde8dc" : "#d7e9e6";
        roundedRect(left + 7, y + 13, carWidth - 14, 22, 6);
        context.fillStyle = isPlayer ? "#2b6970" : "#374c52";
        roundedRect(left + 8, y + 43, carWidth - 16, 17, 5);

        context.fillStyle = "#fff0a6";
        roundedRect(left + 5, y + 4, 9, 5, 2);
        roundedRect(left + carWidth - 14, y + 4, 9, 5, 2);
      }

      function drawRoad() {
        context.fillStyle = "#397454";
        context.fillRect(0, 0, width, height);

        context.fillStyle = "#313b40";
        context.fillRect(48, 0, 324, height);

        context.fillStyle = "#e8e2cf";
        context.fillRect(48, 0, 5, height);
        context.fillRect(367, 0, 5, height);

        context.fillStyle = "#e8e2cf";
        for (const lineX of [157, 263]) {
          for (let y = -40 + roadOffset; y < height; y += 82) {
            context.fillRect(lineX, y, 4, 42);
          }
        }

        for (let y = -32 + roadOffset; y < height; y += 64) {
          context.fillStyle = "#e85b4b";
          context.fillRect(40, y, 8, 32);
          context.fillRect(372, y + 32, 8, 32);
          context.fillStyle = "#f1f1dc";
          context.fillRect(40, y + 32, 8, 32);
          context.fillRect(372, y, 8, 32);
        }
      }

      function draw() {
        drawRoad();
        for (const obstacle of obstacles) {
          drawCar(lanes[obstacle.lane], obstacle.y, obstacle.color, false);
        }
        drawCar(lanes[player.lane], player.y, "#36b9a7", true);
      }

      function updateScore() {
        scoreDisplay.textContent = Math.floor(score).toString();
      }

      function showOverlay(title, message, buttonText) {
        overlayTitle.textContent = title;
        overlayMessage.textContent = message;
        startButton.textContent = buttonText;
        overlay.hidden = false;
      }

      function startGame() {
        score = 0;
        speed = 250;
        spawnTimer = 0.65;
        roadOffset = 0;
        obstacles = [];
        player.lane = 1;
        lastFrame = 0;
        state = "running";
        updateScore();
        overlay.hidden = true;
        pauseButton.disabled = false;
        pauseButton.textContent = "Pause";
        requestAnimationFrame(gameLoop);
      }

      function pauseGame() {
        if (state === "running") {
          state = "paused";
          pauseButton.textContent = "Resume";
          showOverlay("Race paused", "Take a breather. Your score is " + Math.floor(score) + ".", "Resume");
        } else if (state === "paused") {
          state = "running";
          pauseButton.textContent = "Pause";
          overlay.hidden = true;
          lastFrame = 0;
          requestAnimationFrame(gameLoop);
        }
      }

      function endGame() {
        state = "over";
        best = Math.max(best, Math.floor(score));
        bestDisplay.textContent = best.toString();
        pauseButton.disabled = true;
        showOverlay("Crash!", "You scored " + Math.floor(score) + ". Ready for another run?", "Race again");
      }

      function movePlayer(direction) {
        if (state === "running") {
          player.lane = Math.max(0, Math.min(lanes.length - 1, player.lane + direction));
        }
      }

      function collides(obstacle) {
        const horizontalDistance = Math.abs(lanes[player.lane] - lanes[obstacle.lane]);
        const verticalDistance = Math.abs(player.y + player.height / 2 - (obstacle.y + 37));
        return horizontalDistance < 44 && verticalDistance < (player.height + 74) / 2 - 8;
      }

      function gameLoop(timestamp) {
        if (state !== "running") {
          return;
        }

        const delta = lastFrame === 0 ? 0 : Math.min((timestamp - lastFrame) / 1000, 0.05);
        lastFrame = timestamp;
        score += delta * 10;
        speed = Math.min(470, 250 + score * 1.5);
        roadOffset = (roadOffset + speed * delta) % 82;
        spawnTimer -= delta;

        if (spawnTimer <= 0) {
          const lane = Math.floor(Math.random() * lanes.length);
          obstacles.push({
            lane,
            y: -90,
            color: carColors[Math.floor(Math.random() * carColors.length)],
          });
          spawnTimer = Math.max(0.58, 1.15 - score / 500) + Math.random() * 0.3;
        }

        for (const obstacle of obstacles) {
          obstacle.y += speed * delta;
        }
        obstacles = obstacles.filter((obstacle) => obstacle.y < height + 90);
        updateScore();
        draw();

        if (obstacles.some(collides)) {
          endGame();
          draw();
          return;
        }
        requestAnimationFrame(gameLoop);
      }

      startButton.addEventListener("click", () => {
        if (state === "paused") {
          pauseGame();
        } else {
          startGame();
        }
      });

      pauseButton.addEventListener("click", pauseGame);
      document.querySelector("#left-button").addEventListener("click", () => movePlayer(-1));
      document.querySelector("#right-button").addEventListener("click", () => movePlayer(1));

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (["arrowleft", "arrowright", " "].includes(key)) {
          event.preventDefault();
        }
        if (key === "arrowleft" || key === "a") {
          movePlayer(-1);
        } else if (key === "arrowright" || key === "d") {
          movePlayer(1);
        } else if (key === "p" || key === "escape") {
          pauseGame();
        } else if (key === " " && state !== "running") {
          if (state === "paused") {
            pauseGame();
          } else {
            startGame();
          }
        }
      });

      draw();
    </script>
  </body>
</html>
